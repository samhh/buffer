name: Test

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app

      - name: Build
        run: swift build

      - name: Test
        run: swift test
